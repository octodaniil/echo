<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http://127.0.0.1:*; media-src 'self' blob: mediastream:; connect-src 'self' https: wss: http://127.0.0.1:* ws://127.0.0.1:*"
    />
    <title>Echo</title>
    <!-- Inline so the splash paints before the app bundle loads. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070b;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background:
          radial-gradient(520px 300px at 50% 42%, rgba(41, 240, 207, 0.09), transparent 70%),
          linear-gradient(rgba(130, 200, 255, 0.03) 1px, transparent 1px) 0 0 / 36px 36px,
          linear-gradient(90deg, rgba(130, 200, 255, 0.03) 1px, transparent 1px) 0 0 / 36px 36px,
          #05070b;
        transition: opacity 0.28s ease;
        -webkit-app-region: drag;
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      .splash-mark {
        position: relative;
        width: 64px;
        height: 64px;
      }
      .splash-mark i {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid #29f0cf;
        box-shadow: 0 0 18px rgba(41, 240, 207, 0.5);
      }
      .splash-mark i + i,
      .splash-mark i + i + i {
        border-width: 2px;
        box-shadow: none;
        animation: splash-wave 1.6s ease-out infinite;
      }
      .splash-mark i + i + i {
        animation-delay: 0.8s;
      }
      @keyframes splash-wave {
        from {
          transform: scale(1);
          opacity: 0.8;
        }
        to {
          transform: scale(2.3);
          opacity: 0;
        }
      }
      .splash-word {
        font: 700 18px 'Cascadia Code', Consolas, monospace;
        letter-spacing: 0.5em;
        margin-right: -0.5em;
        background: linear-gradient(90deg, #29f0cf, #9ffcf0 60%, #7b61ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .splash-bar {
        width: 140px;
        height: 2px;
        border-radius: 1px;
        background: rgba(130, 220, 255, 0.12);
        overflow: hidden;
      }
      .splash-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #29f0cf;
        box-shadow: 0 0 8px #29f0cf;
        animation: splash-load 1.1s ease-in-out infinite;
      }
      @keyframes splash-load {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <div class="titlebar">
      <span class="titlebar-title">Echo</span>
      <span class="titlebar-info" id="titlebar-info"></span>
    </div>
    <div id="app"></div>
    <div id="splash">
      <div class="splash-inner">
        <div class="splash-mark"><i></i><i></i><i></i></div>
        <div class="splash-word">ECHO</div>
        <div class="splash-bar"></div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
